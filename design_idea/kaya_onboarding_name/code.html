<body class="bg-surface text-on-surface font-body-md text-body-md antialiased min-h-full flex flex-col justify-between selection:bg-primary-container selection:text-on-surface">
<!-- Main Container: Linear Flow (Navigation Shell purposefully suppressed per Semantic Shell rules for Onboarding) -->
<div class="w-full max-w-md mx-auto flex flex-col min-h-screen px-margin py-space-md justify-between">
<!-- Header Section -->
<header class="w-full flex flex-col gap-space-md">
<!-- Top Navigation Row -->
<div class="flex items-center justify-between">
<!-- Back Button: Round white pill with 2.5px black border & 4px hard shadow -->
<button aria-label="Go back" class="w-12 h-12 rounded-full bg-surface-container-lowest border-[2.5px] border-on-surface shadow-[4px_4px_0px_#000000] flex items-center justify-center hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_#000000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined text-on-surface select-none" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Kaya Brand Anchor -->
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-headline-md select-none" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="text-headline-md font-headline-md font-black tracking-tight text-on-surface">Kaya</span>
</div>
<!-- Step Pill Badge -->
<div class="px-space-md py-space-xs rounded-full bg-surface-container-lowest border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000] flex items-center justify-center">
<span class="text-label-sm font-label-sm text-on-surface font-black uppercase tracking-wider">Step 1 of 3</span>
</div>
</div>
<!-- Segmented Step Progress Indicator -->
<div aria-label="Progress bar" class="flex items-center justify-center gap-space-sm pt-space-xs">
<!-- Step 1: Active elongated coral pill with hard stroke -->
<div class="h-3 w-12 rounded-full bg-primary-container border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000] transition-all"></div>
<!-- Step 2: Inactive round peach dot -->
<div class="h-3 w-3 rounded-full bg-tertiary-fixed border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000]"></div>
<!-- Step 3: Inactive round peach dot -->
<div class="h-3 w-3 rounded-full bg-tertiary-fixed border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000]"></div>
</div>
</header>
<!-- Main Content Canvas (Asymmetrical Neubrutalist Stack) -->
<main class="flex-1 flex flex-col justify-center py-space-lg gap-space-lg">
<!-- Tactile Neubrutalist Mascot / Badge Area -->
<div class="flex justify-center items-center">
<div class="relative w-36 h-36 rounded-full bg-secondary-fixed border-[2.5px] border-on-surface shadow-[4px_4px_0px_#000000] flex items-center justify-center">
<!-- Outer decorative accent rings & floating shapes -->
<div class="absolute -top-1 -right-2 w-8 h-8 rounded-full bg-primary-container border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000] flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface text-body-md select-none" data-icon="favorite" data-weight="fill" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="absolute -bottom-1 -left-2 w-7 h-7 rounded-full bg-surface-container-lowest border-[2.5px] border-on-surface shadow-[2px_2px_0px_#000000] flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-body-sm select-none" data-icon="sparkles">arrow_back_ios_new</span>
</div>
<!-- Central friendly smiling sun / warm avatar illustration -->
<div class="w-24 h-24 rounded-full bg-secondary-container border-[2.5px] border-on-surface flex flex-col items-center justify-center relative overflow-hidden">
<!-- Warm Blush Cheeks & Neubrutalist Face -->
<div class="flex items-center gap-5 mt-2">
<div class="w-2.5 h-2.5 bg-on-surface rounded-full"></div>
<div class="w-2.5 h-2.5 bg-on-surface rounded-full"></div>
</div>
<!-- Soft Coral Cheeks -->
<div class="flex items-center justify-between w-16 px-1 mt-1">
<div class="w-3.5 h-2 bg-primary-container rounded-full border border-on-surface"></div>
<div class="w-3.5 h-2 bg-primary-container rounded-full border border-on-surface"></div>
</div>
<!-- Smiling mouth -->
<div class="w-6 h-3 border-b-[3px] border-on-surface rounded-b-full mt-0.5"></div>
</div>
</div>
</div>
<!-- Typography Header Block -->
<div class="text-center space-y-space-xs">
<h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight">
          What should we call you?
        </h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-xs mx-auto leading-relaxed">
          Your name helps Kaya personalize your daily cycle tracking and doctor reports.
        </p>
</div>
<!-- Interactive Neubrutalist Form Block -->
<div class="w-full space-y-space-md">
<div class="flex flex-col gap-space-xs text-left">
<label class="text-label-md font-label-md text-on-surface pl-space-xs flex items-center gap-1.5" for="user-name-input">
<span class="material-symbols-outlined text-body-md select-none" data-icon="badge">badge</span>
            Your Name or Nickname
          </label>
<div class="relative w-full">
<input autocomplete="given-name" autofocus="" class="w-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm border-[2.5px] border-on-surface rounded-full px-space-lg py-3.5 shadow-[4px_4px_0px_#000000] focus:outline-none focus:border-on-surface focus:shadow-[4px_4px_0px_#000000] focus:ring-0 transition-all placeholder:text-on-surface/40 placeholder:font-body-lg placeholder:text-body-lg placeholder:italic" id="user-name-input" placeholder="Enter your name (e.g. Priya)" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-on-surface/40">
<span class="material-symbols-outlined text-headline-sm select-none" data-icon="edit">edit</span>
</div>
</div>
</div>
<!-- Privacy & Local-First Reassurance Pill -->
<div class="flex items-center justify-center">
<div class="inline-flex items-center gap-space-xs bg-tertiary-fixed border-[2.5px] border-on-surface rounded-full px-space-md py-space-xs shadow-[2px_2px_0px_#000000]">
<span class="material-symbols-outlined text-body-md select-none text-on-surface" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-label-sm font-label-sm text-on-surface">Kept private on your device</span>
</div>
</div>
</div>
</main>
<!-- Bottom Docked Area: Linear Action -->
<footer class="w-full pb-space-sm pt-space-xs">
<button class="w-full bg-primary-container text-on-surface font-label-lg text-label-lg rounded-full border-[2.5px] border-on-surface py-4 px-space-lg shadow-[4px_4px_0px_#000000] flex items-center justify-center gap-space-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0px_#000000] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all cursor-pointer" id="continue-button" type="button">
<span>Continue</span>
<span class="material-symbols-outlined font-black select-none text-headline-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Language selector chip helper (Mirroring Kaya's multilingual DNA) -->
<div class="flex justify-center items-center mt-space-sm">
<button class="text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface flex items-center gap-1 transition-colors" type="button">
<span class="material-symbols-outlined text-body-sm select-none" data-icon="language">language</span>
<span>EN | ಕನ್ನಡ | हिं</span>
</button>
</div>
</footer>
</div>
<!-- Micro-interactions Script -->
<script>
    const nameInput = document.getElementById('user-name-input');
    const continueBtn = document.getElementById('continue-button');

    // Input bounce & tactile feedback on enter key
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        continueBtn.click();
      }
    });

    continueBtn.addEventListener('click', () => {
      const val = nameInput.value.trim();
      if (!val) {
        nameInput.focus();
        nameInput.classList.add('animate-shake');
        setTimeout(() => nameInput.classList.remove('animate-shake'), 400);
      } else {
        // Visual tap affirmation
        continueBtn.style.transform = 'translate(4px, 4px)';
        continueBtn.style.boxShadow = '0px 0px 0px #000000';
        setTimeout(() => {
          continueBtn.style.transform = '';
          continueBtn.style.boxShadow = '';
        }, 150);
      }
    });
  </script>
<style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</body></html>
